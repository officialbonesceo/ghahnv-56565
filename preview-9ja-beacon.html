<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>9JA Beacon — SVG Presenter Preview</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, Arial, sans-serif;
      background: #050b14;
      color: #e8eef8;
      line-height: 1.4;
    }
    header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid #1a6dff44;
      background: #0a1628;
    }
    header h1 { margin: 0 0 0.35rem; font-size: 1.35rem; }
    header p { margin: 0; opacity: 0.75; font-size: 0.95rem; }
    main { padding: 1.5rem; max-width: 1100px; margin: 0 auto; }
    section {
      margin-bottom: 2.5rem;
      background: #0d1524;
      border: 1px solid #1a6dff33;
      border-radius: 12px;
      padding: 1.25rem;
    }
    section h2 {
      margin: 0 0 0.75rem;
      font-size: 1.05rem;
      color: #8ab4ff;
    }
    .stage {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #060d18;
      border-radius: 8px;
      padding: 1rem;
      overflow: auto;
    }
    .stage svg { max-width: 100%; height: auto; display: block; }
    .controls {
      margin-top: 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    button {
      background: #1a6dff;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.55rem 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.1); }
    button.secondary { background: #243044; }
    button.active { outline: 2px solid #e10600; }
    .note { font-size: 0.85rem; opacity: 0.65; margin-top: 0.75rem; }
    .phone {
      width: min(320px, 100%);
      aspect-ratio: 9 / 16;
      border: 3px solid #333;
      border-radius: 18px;
      overflow: hidden;
      background: #0a1628;
    }
  </style>
</head>
<body>
  <header>
    <h1>9JA Beacon — SVG template preview (v2)</h1>
    <p>Slimmer build · fixed ears/hair/hands · cleaner suit</p>
  </header>

  <main>

            </linearGradient>
            <linearGradient id="skinGrad" x1="0%" y1="0%" x2="40%" y2="100%">
              <stop offset="0%" stop-color="#d4a574"/>
              <stop offset="100%" stop-color="#b07d52"/>
            </linearGradient>
          </defs>

            <g transform="translate(78,400)">

            <g transform="translate(322,400)">

              <rect x="-4" y="8" width="5" height="14" rx="2" fill="#b07d52"/>

            <g transform="translate(368,148) rotate(-20)">

              <rect x="-10" y="-14" width="5" height="12" rx="2" fill="#b07d52"/>
            </g>
          </g>

          <!-- TORSO — slim, not balloon -->
          <g id="torso">

            <path d="M125 250
                     C125 250 130 245 200 242
                     C270 245 275 250 275 250
                     L265 400
                     C265 400 220 415 200 415
                     C180 415 135 400 135 400 Z"
                  fill="url(#suitGrad)"/>
            <!-- white shirt triangle -->
            <path d="M188 248 L200 355 L212 248 Z" fill="#f2f3f6"/>
            <!-- collar points -->
            <path d="M188 248 L175 268 L200 258 Z" fill="#fff"/>
            <path d="M212 248 L225 268 L200 258 Z" fill="#eee"/>
            <!-- red tie — narrow -->
            <path d="M200 255 L194 300 L200 375 L206 300 Z" fill="#e10600"/>
            <path d="M200 255 L195 268 L200 272 L205 268 Z" fill="#c40500"/>
            <!-- lapels slim -->
            <path d="M130 255 L188 248 L182 360 L138 350 Z" fill="#181c28" opacity="0.95"/>
            <path d="M270 255 L212 248 L218 360 L262 350 Z" fill="#181c28" opacity="0.95"/>
            <!-- pocket hint -->
            <rect x="230" y="310" width="28" height="22" rx="2" fill="none" stroke="#2a3142" stroke-width="1.5"/>
          </g>
