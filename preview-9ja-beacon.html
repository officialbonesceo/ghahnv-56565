<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>9JA Beacon — Presenter v3</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, Arial, sans-serif; background: #050b14; color: #e8eef8; line-height: 1.4; }
    header { padding: 1.25rem 1.5rem; border-bottom: 1px solid #1a6dff44; background: #0a1628; }
    header h1 { margin: 0 0 0.35rem; font-size: 1.35rem; }
    header p { margin: 0; opacity: 0.75; font-size: 0.95rem; }
    main { padding: 1.5rem; max-width: 900px; margin: 0 auto; }
    section { margin-bottom: 2rem; background: #0d1524; border: 1px solid #1a6dff33; border-radius: 12px; padding: 1.25rem; }
    section h2 { margin: 0 0 0.75rem; font-size: 1.05rem; color: #8ab4ff; }
    .stage { display: flex; justify-content: center; align-items: center; background: #060d18; border-radius: 8px; padding: 1.25rem; }
    .controls { margin-top: 1rem; display: flex; flex-wrap: wrap; gap: 0.5rem; }
    button { background: #1a6dff; color: #fff; border: none; border-radius: 8px; padding: 0.55rem 0.9rem; font-weight: 600; cursor: pointer; }
    button.secondary { background: #243044; }
    button.active { outline: 2px solid #e10600; }
    .note { font-size: 0.85rem; opacity: 0.65; margin-top: 0.75rem; }
  </style>
</head>
<body>
  <header>
    <h1>9JA Beacon — presenter v3</h1>
    <p>Neck connected · ears aligned · no junk compilation card</p>
  </header>
  <main>
    <section>
      <h2>News anchor</h2>
      <div class="stage">
        <svg id="anchor" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="280" height="364">
          <defs>
            <linearGradient id="suitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#222836"/>
              <stop offset="100%" stop-color="#12161f"/>
            </linearGradient>
            <linearGradient id="skinGrad" x1="0%" y1="0%" x2="30%" y2="100%">
              <stop offset="0%" stop-color="#d4a574"/>
              <stop offset="100%" stop-color="#b07d52"/>
            </linearGradient>
          </defs>
          <g id="arm_left">
            <path d="M128 268 Q85 310 92 375" stroke="#1c2230" stroke-width="24" stroke-linecap="round" fill="none"/>
            <g transform="translate(92,385)">
              <ellipse cx="0" cy="0" rx="12" ry="10" fill="#b07d52"/>
              <rect x="-9" y="5" width="4" height="10" rx="1.5" fill="#b07d52"/>
              <rect x="-3.5" y="7" width="4" height="12" rx="1.5" fill="#b07d52"/>
              <rect x="2" y="7" width="4" height="11" rx="1.5" fill="#b07d52"/>
              <rect x="7.5" y="4" width="4" height="9" rx="1.5" fill="#b07d52" transform="rotate(10)"/>
            </g>
          </g>
          <g id="arm_right">
            <path d="M272 268 Q315 310 308 375" stroke="#1c2230" stroke-width="24" stroke-linecap="round" fill="none"/>
            <g transform="translate(308,385)">
              <ellipse cx="0" cy="0" rx="12" ry="10" fill="#b07d52"/>
              <rect x="-9" y="5" width="4" height="10" rx="1.5" fill="#b07d52"/>
              <rect x="-3.5" y="7" width="4" height="12" rx="1.5" fill="#b07d52"/>
              <rect x="2" y="7" width="4" height="11" rx="1.5" fill="#b07d52"/>
              <rect x="7.5" y="4" width="4" height="9" rx="1.5" fill="#b07d52" transform="rotate(-10)"/>
            </g>
          </g>
          <g id="arm_right_point" opacity="0">
            <path d="M272 262 Q330 235 342 175" stroke="#1c2230" stroke-width="22" stroke-linecap="round" fill="none"/>
            <g transform="translate(345,162) rotate(-20)">
              <ellipse cx="0" cy="0" rx="11" ry="9" fill="#b07d52"/>
              <rect x="-3" y="-14" width="4" height="12" rx="1.5" fill="#b07d52"/>
              <rect x="3" y="-12" width="4" height="10" rx="1.5" fill="#b07d52"/>
              <rect x="-8" y="-11" width="4" height="9" rx="1.5" fill="#b07d52"/>
            </g>
          </g>
          <g id="torso">
            <path d="M132 250 C150 242 175 238 200 238 C225 238 250 242 268 250 L256 388 C248 400 222 408 200 408 C178 408 152 400 144 388 Z" fill="url(#suitGrad)"/>
            <path d="M191 244 L200 340 L209 244 Z" fill="#f2f3f6"/>
            <path d="M191 244 L180 262 L200 252 Z" fill="#fff"/>
            <path d="M209 244 L220 262 L200 252 Z" fill="#eceef2"/>
            <path d="M200 250 L196 290 L200 355 L204 290 Z" fill="#e10600"/>
            <path d="M200 250 L197 260 L200 263 L203 260 Z" fill="#c40500"/>
            <path d="M136 252 L191 244 L186 348 L148 338 Z" fill="#181c28"/>
            <path d="M264 252 L209 244 L214 348 L252 338 Z" fill="#181c28"/>
            <rect x="226" y="298" width="24" height="18" rx="2" fill="none" stroke="#2a3142" stroke-width="1.5"/>
          </g>
          <path d="M182 228 C182 228 182 248 182 255 L218 255 C218 248 218 228 218 228 C210 232 190 232 182 228 Z" fill="#b07d52"/>
          <path d="M175 248 Q200 258 225 248 L218 255 L182 255 Z" fill="#f2f3f6"/>
          <g id="head">
            <ellipse cx="200" cy="125" rx="54" ry="56" fill="#1a120e"/>
            <ellipse cx="200" cy="132" rx="48" ry="54" fill="url(#skinGrad)"/>
            <path d="M152 118 C154 85 175 76 200 74 C225 76 246 85 248 118 C240 102 222 94 200 93 C178 94 160 102 152 118 Z" fill="#1a120e"/>
            <path d="M152 120 C150 140 152 155 156 162 L162 150 C158 140 156 128 152 120 Z" fill="#1a120e"/>
            <path d="M248 120 C250 140 248 155 244 162 L238 150 C242 140 244 128 248 120 Z" fill="#1a120e"/>
            <ellipse cx="154" cy="138" rx="8" ry="13" fill="#b07d52"/>
            <ellipse cx="154" cy="138" rx="4.5" ry="7" fill="#c9956c"/>
            <ellipse cx="246" cy="138" rx="8" ry="13" fill="#b07d52"/>
            <ellipse cx="246" cy="138" rx="4.5" ry="7" fill="#c9956c"/>
            <path d="M146 128 Q154 122 158 132" fill="#1a120e"/>
            <path d="M254 128 Q246 122 242 132" fill="#1a120e"/>
            <ellipse cx="182" cy="128" rx="10" ry="12" fill="#fff"/>
            <ellipse cx="218" cy="128" rx="10" ry="12" fill="#fff"/>
            <ellipse cx="183" cy="130" rx="5" ry="6" fill="#2a1810"/>
            <ellipse cx="219" cy="130" rx="5" ry="6" fill="#2a1810"/>
            <circle cx="184.5" cy="127" r="1.8" fill="#fff"/>
            <circle cx="220.5" cy="127" r="1.8" fill="#fff"/>
            <path d="M171 114 Q182 109 193 114" stroke="#1a120e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <path d="M207 114 Q218 109 229 114" stroke="#1a120e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <path d="M200 134 L197 150 Q200 153 203 150 Z" fill="#a07050"/>
            <ellipse cx="200" cy="175" rx="18" ry="10" fill="#b07d52"/>
          </g>
          <g id="mouth_closed">
            <path d="M186 165 Q200 172 214 165" stroke="#5c3028" stroke-width="2.6" fill="none" stroke-linecap="round"/>
          </g>
          <g id="mouth_smile" opacity="0">
            <path d="M184 163 Q200 178 216 163" stroke="#5c3028" stroke-width="2.8" fill="none" stroke-linecap="round"/>
          </g>
          <g id="mouth_open" opacity="0">
            <ellipse cx="200" cy="170" rx="11" ry="10" fill="#6b2030"/>
            <ellipse cx="200" cy="165" rx="8" ry="3.5" fill="#f0e8e0"/>
          </g>
          <g id="mouth_wide" opacity="0">
            <ellipse cx="200" cy="172" rx="14" ry="12" fill="#6b2030"/>
            <ellipse cx="200" cy="165" rx="10" ry="4" fill="#f0e8e0"/>
          </g>
        </svg>
      </div>
      <div class="controls">
        <button type="button" data-mouth="closed" class="active">Mouth closed</button>
        <button type="button" data-mouth="smile">Smile</button>
        <button type="button" data-mouth="open">Open</button>
        <button type="button" data-mouth="wide">Wide</button>
        <button type="button" id="btn-point" class="secondary">Point arm</button>
        <button type="button" id="btn-talk" class="secondary">Demo talk</button>
      </div>
      <p class="note">v3: jaw overlaps neck · ears on face edge · no full-storyboard junk section</p>
    </section>
    <section>
      <h2>Lower third only</h2>
      <div class="stage">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 160" width="100%" style="max-width:860px">
          <rect x="40" y="24" width="200" height="40" rx="4" fill="#e10600"/>
          <text x="140" y="52" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="20" font-weight="700" fill="#fff">BREAKING NEWS</text>
          <rect x="40" y="72" width="1000" height="52" rx="4" fill="#f4f6fa"/>
          <rect x="40" y="72" width="8" height="52" fill="#1a6dff"/>
          <text x="60" y="106" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0a1628">MAJOR DEVELOPMENTS ACROSS NIGERIA</text>
        </svg>
      </div>
    </section>
  </main>
  <script>
    const mouths = ["mouth_closed", "mouth_smile", "mouth_open", "mouth_wide"];
    function setMouth(name) {
      mouths.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.setAttribute("opacity", id === "mouth_" + name ? "1" : "0");
      });
      document.querySelectorAll("[data-mouth]").forEach(b => {
        b.classList.toggle("active", b.getAttribute("data-mouth") === name);
      });
    }
    document.querySelectorAll("[data-mouth]").forEach(btn => {
      btn.addEventListener("click", () => setMouth(btn.getAttribute("data-mouth")));
    });
    document.getElementById("btn-point").addEventListener("click", () => {
      const idle = document.getElementById("arm_right");
      const point = document.getElementById("arm_right_point");
      const on = point.getAttribute("opacity") !== "1";
      point.setAttribute("opacity", on ? "1" : "0");
      idle.setAttribute("opacity", on ? "0" : "1");
    });
    let talkTimer = null;
    document.getElementById("btn-talk").addEventListener("click", () => {
      if (talkTimer) { clearInterval(talkTimer); talkTimer = null; setMouth("closed"); return; }
      const seq = ["open", "closed", "wide", "closed", "open", "smile", "closed"];
      let i = 0;
      talkTimer = setInterval(() => { setMouth(seq[i % seq.length]); i++; }, 120);
    });
  </script>
</body>
</html>
