<!DOCTYPE html>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, Arial, sans-serif;
      background: #050b14;
      color: #e8eef8;
      line-height: 1.4;
    }
    header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid #1a6dff44;
      background: #0a1628;
    }
    header h1 { margin: 0 0 0.35rem; font-size: 1.35rem; }
    header p { margin: 0; opacity: 0.75; font-size: 0.95rem; }
    main { padding: 1.5rem; max-width: 1100px; margin: 0 auto; }
    section {
      margin-bottom: 2.5rem;
      background: #0d1524;
      border: 1px solid #1a6dff33;
      border-radius: 12px;
      padding: 1.25rem;
    }
    section h2 {
      margin: 0 0 0.75rem;
      font-size: 1.05rem;
      color: #8ab4ff;
    }
    .stage {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #060d18;
      border-radius: 8px;
      padding: 1rem;
      overflow: auto;
    }
    .stage svg { max-width: 100%; height: auto; display: block; }
    .controls {
      margin-top: 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    button {
      background: #1a6dff;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.55rem 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.1); }
    button.secondary { background: #243044; }
    button.active { outline: 2px solid #e10600; }
    .note { font-size: 0.85rem; opacity: 0.65; margin-top: 0.75rem; }
    .phone {
      width: min(320px, 100%);
      aspect-ratio: 9 / 16;
      border: 3px solid #333;
      border-radius: 18px;
      overflow: hidden;
      background: #0a1628;
    }
  </style>
</head>

  <script>
    const mouths = ["mouth_closed", "mouth_smile", "mouth_open", "mouth_wide"];
    function setMouth(name) {
      mouths.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.setAttribute("opacity", id === "mouth_" + name ? "1" : "0");
      });
      document.querySelectorAll("[data-mouth]").forEach(b => {
        b.classList.toggle("active", b.getAttribute("data-mouth") === name);
      });
    }
    document.querySelectorAll("[data-mouth]").forEach(btn => {
      btn.addEventListener("click", () => setMouth(btn.getAttribute("data-mouth")));
    });
    document.getElementById("btn-point").addEventListener("click", () => {
      const idle = document.getElementById("arm_right");
      const point = document.getElementById("arm_right_point");
      const on = point.getAttribute("opacity") !== "1";
      point.setAttribute("opacity", on ? "1" : "0");
      idle.setAttribute("opacity", on ? "0" : "1");
    });
    let talkTimer = null;
    document.getElementById("btn-talk").addEventListener("click", () => {
      if (talkTimer) { clearInterval(talkTimer); talkTimer = null; setMouth("closed"); return; }
      const seq = ["open", "closed", "wide", "closed", "open", "smile", "closed"];
      let i = 0;
      talkTimer = setInterval(() => {
        setMouth(seq[i % seq.length]);
        i++;
      }, 120);
    });
  </script>
</body>
</html>
