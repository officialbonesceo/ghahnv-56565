name: list-buffer-channels

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/list_buffer_channels.py"
      - ".github/workflows/list-buffer-channels.yml"

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: deps
        run: pip install requests

      - name: list-channels
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORG_ID: ${{ secrets.BUFFER_ORG_ID }}
        run: python scripts/list_buffer_channels.py
