name: fix-fb-meta
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-fb-meta.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: patch
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('scripts/upload_buffer.py')
          t = p.read_text()
          old = '''def metadata_graphql(service: str, kind: str = "video") -> str:
    if service == "instagram" and kind == "video":
        return "metadata: { instagram: { type: reel, shouldShareToFeed: true } }"
    if service == "instagram" and kind == "image":
        return "metadata: { instagram: { type: post, shouldShareToFeed: true } }"
    return ""'''
          new = '''def metadata_graphql(service: str, kind: str = "video") -> str:
    if service == "instagram" and kind == "video":
        return "metadata: { instagram: { type: reel, shouldShareToFeed: true } }"
    if service == "instagram" and kind == "image":
        return "metadata: { instagram: { type: post, shouldShareToFeed: true } }"
    if service == "facebook" and kind == "video":
        return "metadata: { facebook: { type: reel } }"
    if service == "facebook" and kind == "image":
        return "metadata: { facebook: { type: post } }"
    return ""'''
          if old in t:
              t = t.replace(old, new)
              print('patched facebook meta')
          else:
              print('block not found')
          p.write_text(t)
          assert 'facebook: { type: reel }' in t
          PY
      - name: commit
        run: |
          git config user.name "mike-bot"
          git config user.email "bot@users.noreply.github.com"
          git add scripts/upload_buffer.py
          git commit -m "fix: Facebook posts require type reel/post" || true
          git push || true
