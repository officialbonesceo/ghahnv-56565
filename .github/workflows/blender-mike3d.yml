name: blender-mike3d-test

on:
  workflow_dispatch:
  push:
    paths:
      - "data/force_blender3d.tick"
      - "scripts/mike_mouth_talk.py"
      - "scripts/mike_teach_topic.py"
      - "scripts/mike_teach_video.py"
      - "assets/mike/**"
      - ".github/workflows/blender-mike3d.yml"

permissions:
  contents: write

jobs:
  render3d:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: install-blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender xvfb ffmpeg python3 python3-numpy python3-pip fonts-dejavu-core || true
          blender --version || true
          # Blender's own Python needs numpy for glTF import
          BL_PY=$(blender -b --python-expr "import sys; print(sys.executable)" 2>/dev/null | tail -1 || true)
          echo "BLENDER_PYTHON=$BL_PY"
          if [ -n "$BL_PY" ] && [ -x "$BL_PY" ]; then
            "$BL_PY" -m pip install --user numpy 2>/dev/null || "$BL_PY" -m ensurepip --user 2>/dev/null || true
            "$BL_PY" -m pip install --user numpy || true
          fi
          python3 -m pip install --user numpy || pip3 install --user numpy || true
          # Make system numpy visible if Blender uses system paths
          echo "PYTHONPATH=/usr/lib/python3/dist-packages:${HOME}/.local/lib/python3.12/site-packages:${PYTHONPATH}" >> $GITHUB_ENV

      - name: assemble-mike-glb
        run: |
          python3 scripts/assemble_mike_glb.py || true
          if [ -f assets/mike/Mikeanim.glb ]; then ls -lh assets/mike/Mikeanim.glb
          elif [ -f assets/mike/Mike.glb ]; then ls -lh assets/mike/Mike.glb
          else echo "NO GLB" >&2; exit 1; fi

      - name: render-teach-topic
        env:
          PYTHONPATH: /usr/lib/python3/dist-packages:/usr/lib/python3/site-packages
        run: |
          mkdir -p assets/blender
          if [ -f assets/mike/Mikeanim.glb ]; then GLB=assets/mike/Mikeanim.glb; else GLB=assets/mike/Mike.glb; fi
          echo "Teach topic video $GLB"
          export PYTHONPATH="/usr/lib/python3/dist-packages:/usr/lib/python3/site-packages:${HOME}/.local/lib/python3.12/site-packages:${HOME}/.local/lib/python3.13/site-packages:${PYTHONPATH}"
          # Also inject into Blender if needed
          BL_PY=$(blender -b --python-expr "import sys; print(sys.executable)" 2>/dev/null | tail -1 || true)
          if [ -n "$BL_PY" ] && [ -x "$BL_PY" ]; then
            "$BL_PY" -m pip install numpy 2>/dev/null || true
          fi
          xvfb-run -a env PYTHONPATH="$PYTHONPATH" blender -b -noaudio -P scripts/mike_teach_topic.py -- \
            --glb "$GLB" \
            --out assets/blender/mike_teach_topic.mp4 \
            --width 720 --height 1280 --fps 24 --seconds 14 \
            --topic "What is Coding?" \
            --line "Coding is how we give computers step-by-step instructions."
          ls -lh assets/blender/mike_teach_topic.mp4
          ffprobe -v error -show_entries format=duration,size -of default assets/blender/mike_teach_topic.mp4 || true

      - name: commit-output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/blender/mike_teach_topic.mp4 || true
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Mike teach topic video (walk + explain + mouth)"
            git push
          fi

      - name: pack
        uses: actions/upload-artifact@v4
        with:
          name: mike-teach-topic
          path: assets/blender/mike_teach_topic.mp4
          if-no-files-found: error
          retention-days: 7
