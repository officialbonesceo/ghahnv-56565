name: blender-mike3d-test

on:
  workflow_dispatch:
  push:
    paths:
      - "data/force_blender3d.tick"
      - "scripts/blender_mike3d.py"
      - "scripts/blender_mike3d_facial.py"
      - "scripts/add_mike_face_rig.py"
      - "scripts/face_overlay_composite.py"
      - "scripts/assemble_mike_glb.py"
      - "assets/mike/**"
      - ".github/workflows/blender-mike3d.yml"

permissions:
  contents: read

jobs:
  render3d:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: install-blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender xvfb ffmpeg python3 python3-numpy python3-pip || true
          blender --version || true
          python3 -m pip install --user numpy || pip3 install --user numpy || true
          echo "PYTHONPATH=/usr/lib/python3/dist-packages:$HOME/.local/lib/python3.12/site-packages" >> $GITHUB_ENV

      - name: assemble-mike-glb
        run: |
          python3 scripts/assemble_mike_glb.py || true
          if [ -f assets/mike/Mikeanim.glb ]; then
            echo "USING Mikeanim.glb"
            ls -lh assets/mike/Mikeanim.glb
            GLB=assets/mike/Mikeanim.glb
          elif [ -f assets/mike/Mike.glb ]; then
            echo "USING Mike.glb"
            ls -lh assets/mike/Mike.glb
            GLB=assets/mike/Mike.glb
          else
            echo "NO GLB FOUND" >&2
            exit 1
          fi
          echo "GLB=$GLB" >> $GITHUB_ENV

      - name: add-face-rig-export-proof
        env:
          PYTHONPATH: /usr/lib/python3/dist-packages:/usr/lib/python3/site-packages
        run: |
          mkdir -p assets/blender assets/mike
          export PYTHONPATH="/usr/lib/python3/dist-packages:/usr/lib/python3/site-packages:${HOME}/.local/lib/python3.12/site-packages:${PYTHONPATH}"
          if [ -f assets/mike/Mikeanim.glb ]; then GLB=assets/mike/Mikeanim.glb; else GLB=assets/mike/Mike.glb; fi
          echo "Adding Head-parented face bones+meshes to $GLB"
          xvfb-run -a env PYTHONPATH="$PYTHONPATH" blender -b -noaudio -P scripts/add_mike_face_rig.py -- \
            --glb "$GLB" \
            --out-glb assets/mike/Mike_face.glb \
            --out-mp4 assets/blender/mike_face_proof.mp4 \
            --width 720 \
            --height 1280 \
            --fps 24
          ls -lh assets/mike/Mike_face.glb assets/blender/mike_face_proof.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=width,height -of default assets/blender/mike_face_proof.mp4 || true

      - name: pack
        uses: actions/upload-artifact@v4
        with:
          name: mike-face-rig
          path: |
            assets/mike/Mike_face.glb
            assets/blender/mike_face_proof.mp4
          if-no-files-found: error
          retention-days: 7
