name: blender-mike3d-test

on:
  workflow_dispatch:
  push:
    paths:
      - "data/force_blender3d.tick"
      - "scripts/blender_mike3d.py"
      - "scripts/assemble_mike_glb.py"
      - "assets/mike/**"
      - ".github/workflows/blender-mike3d.yml"

permissions:
  contents: read

jobs:
  render3d:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: install-blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender xvfb ffmpeg python3 python3-numpy python3-pip || true
          # Blender 5 glTF importer needs numpy on the Python it embeds/uses
          blender --version || true
          blender -b --python-expr "import sys; print('BLENDER_PY', sys.executable); print(sys.path[:5])" || true
          # Install numpy into paths Blender can see
          python3 -m pip install --user numpy || pip3 install --user numpy || true
          # Also try blender's own python if distinct
          BL_PY=$(blender -b --python-expr "import sys; print(sys.executable)" 2>/dev/null | tail -1 || true)
          if [ -n "$BL_PY" ] && [ -x "$BL_PY" ]; then
            "$BL_PY" -m pip install numpy 2>/dev/null || true
          fi
          # Debian/Ubuntu dist-packages often work when PYTHONPATH is set
          echo "PYTHONPATH=/usr/lib/python3/dist-packages:$HOME/.local/lib/python3.12/site-packages" >> $GITHUB_ENV

      - name: assemble-mike-glb
        run: |
          python3 scripts/assemble_mike_glb.py
          ls -lh assets/mike/Mike.glb
          python3 - <<'PY'
          from pathlib import Path
          import struct, json
          p = Path("assets/mike/Mike.glb")
          data = p.read_bytes()
          assert data[:4] == b"glTF"
          offset = 12
          clen, ctype = struct.unpack_from("<I4s", data, offset)
          js = json.loads(data[offset+8:offset+8+clen].decode().rstrip(" \0"))
          print("skins", len(js.get("skins", [])))
          print("nodes", len(js.get("nodes", [])))
          print("anims", len(js.get("animations", [])))
          if js.get("skins"):
              print("joints", len(js["skins"][0].get("joints", [])))
          PY

      - name: render-glb-mike3d
        env:
          PYTHONPATH: /usr/lib/python3/dist-packages:/usr/lib/python3/site-packages
        run: |
          mkdir -p assets/blender
          # Ensure numpy visible to blender python
          export PYTHONPATH="/usr/lib/python3/dist-packages:/usr/lib/python3/site-packages:${HOME}/.local/lib/python3.12/site-packages:${HOME}/.local/lib/python3.13/site-packages:${PYTHONPATH}"
          python3 -c "import numpy; print('host numpy', numpy.__version__)" || true
          xvfb-run -a env PYTHONPATH="$PYTHONPATH" blender -b -noaudio -P scripts/blender_mike3d.py -- \
            --glb assets/mike/Mike.glb \
            --out assets/blender/mike3d_test.mp4 \
            --seconds 6 \
            --width 720 \
            --height 1280
          ls -lh assets/blender/mike3d_test.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=width,height,codec_name -of default assets/blender/mike3d_test.mp4

      - name: pack
        uses: actions/upload-artifact@v4
        with:
          name: mike3d-test
          path: |
            assets/blender/mike3d_test.mp4
          if-no-files-found: error
          retention-days: 5
