name: blender-mike3d-test

on:
  workflow_dispatch:
  push:
    paths:
      - "data/force_blender3d.tick"
      - "scripts/mike_mouth_talk.py"
      - "scripts/mike_teach_topic.py"
      - "scripts/generate_mike_voice.py"
      - "scripts/mike_teach_video.py"
      - "assets/mike/**"
      - ".github/workflows/blender-mike3d.yml"

permissions:
  contents: write

jobs:
  render3d:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: install-deps
        run: |
          sudo apt-get update
          sudo apt-get install -y blender xvfb ffmpeg python3 python3-numpy python3-pip fonts-dejavu-core espeak-ng libsndfile1 || true
          blender --version || true
          BL_PY=$(blender -b --python-expr "import sys; print(sys.executable)" 2>/dev/null | tail -1 || true)
          echo "BLENDER_PYTHON=$BL_PY"
          if [ -n "$BL_PY" ] && [ -x "$BL_PY" ]; then
            "$BL_PY" -m pip install --user numpy 2>/dev/null || true
            "$BL_PY" -m pip install numpy 2>/dev/null || true
          fi
          python3 -m pip install --user numpy soundfile edge-tts || pip3 install --user numpy soundfile edge-tts || true
          # Kokoro may need a few minutes first download
          python3 -m pip install --user "kokoro>=0.9.4" || pip3 install --user "kokoro>=0.9.4" || true
          echo "PYTHONPATH=/usr/lib/python3/dist-packages:${HOME}/.local/lib/python3.12/site-packages:${HOME}/.local/lib/python3.13/site-packages" >> $GITHUB_ENV

      - name: assemble-mike-glb
        run: |
          python3 scripts/assemble_mike_glb.py || true
          if [ -f assets/mike/Mikeanim.glb ]; then ls -lh assets/mike/Mikeanim.glb
          elif [ -f assets/mike/Mike.glb ]; then ls -lh assets/mike/Mike.glb
          else echo "NO GLB" >&2; exit 1; fi

      - name: generate-voice-kokoro
        run: |
          mkdir -p assets/blender
          export PYTHONPATH="/usr/lib/python3/dist-packages:${HOME}/.local/lib/python3.12/site-packages:${HOME}/.local/lib/python3.13/site-packages:${PYTHONPATH}"
          python3 scripts/generate_mike_voice.py \
            --out assets/blender/mike_voice.wav \
            --voice am_michael \
            --text "Hey! I'm Mike. Coding is how we give computers step-by-step instructions. You write rules in a language the computer understands, and it follows them. Start small, practice every day, and you can build apps, games, and tools. Let's learn together!"
          ls -lh assets/blender/mike_voice.wav || ls -lh assets/blender/mike_voice.* || true
          ffprobe -v error -show_entries format=duration -of default assets/blender/mike_voice.wav || true

      - name: render-teach-topic
        run: |
          mkdir -p assets/blender
          if [ -f assets/mike/Mikeanim.glb ]; then GLB=assets/mike/Mikeanim.glb; else GLB=assets/mike/Mike.glb; fi
          export PYTHONPATH="/usr/lib/python3/dist-packages:${HOME}/.local/lib/python3.12/site-packages:${HOME}/.local/lib/python3.13/site-packages:${PYTHONPATH}"
          BL_PY=$(blender -b --python-expr "import sys; print(sys.executable)" 2>/dev/null | tail -1 || true)
          if [ -n "$BL_PY" ] && [ -x "$BL_PY" ]; then "$BL_PY" -m pip install numpy 2>/dev/null || true; fi
          echo "Teach 15s multi-cam $GLB"
          xvfb-run -a env PYTHONPATH="$PYTHONPATH" blender -b -noaudio -P scripts/mike_teach_topic.py -- \
            --glb "$GLB" \
            --out assets/blender/mike_teach_topic.mp4 \
            --voice assets/blender/mike_voice.wav \
            --width 720 --height 1280 --fps 24 --seconds 15 \
            --topic "What is Coding?" \
            --line "Step-by-step instructions for computers."
          ls -lh assets/blender/mike_teach_topic.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_type -of default assets/blender/mike_teach_topic.mp4 || true

      - name: commit-output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/blender/mike_teach_topic.mp4 assets/blender/mike_voice.wav || true
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Mike 15s teach: multi-cam + Kokoro voice"
            git push
          fi

      - name: pack
        uses: actions/upload-artifact@v4
        with:
          name: mike-teach-topic
          path: |
            assets/blender/mike_teach_topic.mp4
            assets/blender/mike_voice.wav
          if-no-files-found: error
          retention-days: 7
