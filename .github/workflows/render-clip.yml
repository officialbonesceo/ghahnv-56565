name: Render talking clip

on:
  workflow_dispatch:
    inputs:
      script_text:
        description: "Text or short prompt for the narrator"
        required: true
        default: "Welcome to Talking Clip Factory. AI expands the line, Edge speaks it, Blender renders a simple 3D character."
      voice:
        description: "Edge TTS voice"
        required: true
        default: "en-US-JennyNeural"
        type: choice
        options:
          - en-US-JennyNeural
          - en-US-GuyNeural
          - en-GB-SoniaNeural
          - en-NG-EzinneNeural
          - en-NG-AbeoNeural
      use_llm:
        description: "Expand script with TinyLlama"
        required: true
        default: true
        type: boolean
      use_blender:
        description: "Render with Blender 3D (ffmpeg fallback if it fails)"
        required: true
        default: true
        type: boolean

env:
  BLENDER_VERSION: "4.2.3"
  BLENDER_DIR: ${{ github.workspace }}/.blender

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libxkbcommon0 libxi6 libxxf86vm1 libxfixes3 libgl1 libxrender1
          ffmpeg -version

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Cache TinyLlama GGUF
        if: ${{ inputs.use_llm }}
        uses: actions/cache@v4
        with:
          path: models
          key: tinyllama-q4km-v1

      - name: Expand script (TinyLlama)
        if: ${{ inputs.use_llm }}
        env:
          SCRIPT_TEXT: ${{ inputs.script_text }}
        run: |
          python scripts/expand_script.py --text "$SCRIPT_TEXT" --model-dir models --out script.txt || {
            echo "LLM soft-failed; using original text"
            printf '%s\n' "$SCRIPT_TEXT" > script.txt
          }
          echo "--- script ---"
          cat script.txt

      - name: Write script without LLM
        if: ${{ !inputs.use_llm }}
        env:
          SCRIPT_TEXT: ${{ inputs.script_text }}
        run: printf '%s\n' "$SCRIPT_TEXT" > script.txt && cat script.txt

      - name: Edge TTS + ffmpeg baseline
        env:
          VOICE: ${{ inputs.voice }}
        run: |
          TEXT=$(cat script.txt)
          python scripts/render_clip.py --text "$TEXT" --voice "$VOICE" --out output_ffmpeg.mp4 --audio-out speech.mp3
          ls -lh speech.mp3 output_ffmpeg.mp4

      - name: Cache Blender
        if: ${{ inputs.use_blender }}
        uses: actions/cache@v4
        with:
          path: ${{ env.BLENDER_DIR }}
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Install Blender
        if: ${{ inputs.use_blender }}
        run: |
          set -e
          if [ -x "$BLENDER_DIR/blender" ]; then
            echo "Blender cache hit"
            "$BLENDER_DIR/blender" --version
            exit 0
          fi
          mkdir -p "$BLENDER_DIR"
          URL="https://download.blender.org/release/Blender${BLENDER_VERSION%.*}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          echo "Downloading $URL"
          curl -L --fail -o /tmp/blender.tar.xz "$URL"
          tar -xJf /tmp/blender.tar.xz -C /tmp
          SRC=$(find /tmp -maxdepth 1 -type d -name "blender-${BLENDER_VERSION}-linux-x64" | head -1)
          cp -a "$SRC"/. "$BLENDER_DIR"/
          "$BLENDER_DIR/blender" --version

      - name: Blender 3D render
        if: ${{ inputs.use_blender }}
        continue-on-error: true
        run: |
          set -e
          TEXT=$(cat script.txt)
          DUR=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 speech.mp3)
          echo "Audio duration: $DUR"
          "$BLENDER_DIR/blender" -b -noaudio -P scripts/blender_talking_scene.py -- \
            --audio "$(pwd)/speech.mp3" \
            --out "$(pwd)/output_blender.mp4" \
            --text "$TEXT" \
            --seconds "$DUR"
          ls -lh output_blender.mp4

      - name: Pick final output
        run: |
          if [ -f output_blender.mp4 ] && [ -s output_blender.mp4 ]; then
            cp output_blender.mp4 output.mp4
            echo "Using Blender output"
          else
            cp output_ffmpeg.mp4 output.mp4
            echo "Using ffmpeg fallback"
          fi
          ls -lh output.mp4 speech.mp3 script.txt

      - uses: actions/upload-artifact@v4
        with:
          name: talking-clip
          path: |
            output.mp4
            output_ffmpeg.mp4
            speech.mp3
            script.txt
          if-no-files-found: error
          retention-days: 7
