name: Render talking clip

on:
  workflow_dispatch:
    inputs:
      script_text:
        description: "Text the narrator will speak"
        required: true
        default: "Welcome to Talking Clip Factory. Cyber host online with lip sync."
      voice:
        description: "Edge TTS voice"
        required: true
        default: "en-US-GuyNeural"
        type: choice
        options:
          - en-US-JennyNeural
          - en-US-GuyNeural
          - en-GB-SoniaNeural
          - en-NG-EzinneNeural
          - en-NG-AbeoNeural
      use_expand:
        description: "Polish short text (offline)"
        required: true
        default: true
        type: boolean

env:
  RHUBARB_VERSION: "1.13.0"
  RHUBARB_DIR: ${{ github.workspace }}/.rhubarb

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip fonts-dejavu-core
          ffmpeg -version

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Expand script
        env:
          SCRIPT_TEXT: ${{ inputs.script_text }}
          USE_EXPAND: ${{ inputs.use_expand }}
        run: |
          if [ "$USE_EXPAND" = "true" ]; then
            python scripts/expand_script.py --text "$SCRIPT_TEXT" --out script.txt
          else
            printf '%s\n' "$SCRIPT_TEXT" > script.txt
          fi
          cat script.txt

      - name: Edge TTS
        env:
          VOICE: ${{ inputs.voice }}
        run: |
          set -e
          TEXT=$(cat script.txt)
          python scripts/render_clip.py \
            --text "$TEXT" --voice "$VOICE" \
            --out output_ffmpeg.mp4 --audio-out speech.mp3
          ffmpeg -y -i speech.mp3 -ar 16000 -ac 1 speech.wav
          ls -lh speech.mp3 speech.wav output_ffmpeg.mp4

      - name: Cache Rhubarb
        uses: actions/cache@v4
        with:
          path: ${{ env.RHUBARB_DIR }}
          key: rhubarb-${{ env.RHUBARB_VERSION }}-linux

      - name: Install Rhubarb
        run: |
          set -e
          if [ -x "$RHUBARB_DIR/rhubarb" ]; then
            exit 0
          fi
          mkdir -p "$RHUBARB_DIR" /tmp/rhubarb
          URL="https://github.com/DanielSWolf/rhubarb-lip-sync/releases/download/v${RHUBARB_VERSION}/Rhubarb-Lip-Sync-${RHUBARB_VERSION}-Linux.zip"
          curl -L --fail -o /tmp/rhubarb.zip "$URL"
          unzip -o /tmp/rhubarb.zip -d /tmp/rhubarb
          BIN=$(find /tmp/rhubarb -type f -name rhubarb | head -1)
          cp "$BIN" "$RHUBARB_DIR/rhubarb"
          chmod +x "$RHUBARB_DIR/rhubarb"
          cp -a "$(dirname "$BIN")"/. "$RHUBARB_DIR"/ || true

      - name: Rhubarb mouth cues
        run: |
          set -e
          "$RHUBARB_DIR/rhubarb" -f json -o mouth.json --extendedShapes "" speech.wav
          head -c 600 mouth.json; echo

      - name: Render 2.5D cyber host
        run: |
          set -e
          TEXT=$(cat script.txt)
          python scripts/render_25d_host.py \
            --audio speech.mp3 \
            --cues mouth.json \
            --text "$TEXT" \
            --out output.mp4
          ls -lh output.mp4
          ffprobe -hide_banner output.mp4 2>&1 | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: talking-clip
          path: |
            output.mp4
            output_ffmpeg.mp4
            speech.mp3
            script.txt
            mouth.json
          if-no-files-found: error
          retention-days: 7
