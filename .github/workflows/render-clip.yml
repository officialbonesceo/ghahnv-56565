name: Render talking clip

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  RHUBARB_VERSION: "1.13.0"
  RHUBARB_DIR: ${{ github.workspace }}/.rhubarb
  VOICE: en-US-GuyNeural
  ACTIONS: talk,walk,point,laugh

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y ffmpeg unzip fonts-dejavu-core

      - name: Python deps
        run: pip install --upgrade pip && pip install edge-tts Pillow requests

      - name: Build MEZI sprites
        run: python scripts/write_mezi_assets.py

      - name: Fetch topic
        run: python scripts/fetch_topics.py topic.json

      - name: Generate script
        run: python scripts/generate_script.py --topic topic.json --out script_job.json

      - name: Cache backgrounds
        uses: actions/cache@v4
        with:
          path: assets/bg
          key: mezi-bg-v1

      - name: Generate background
        run: |
          BG=science
          test -f bg.txt && BG=$(cat bg.txt)
          python scripts/generate_bg.py --bg "$BG" --out-dir assets/bg
          cat bg_path.txt || true

      - name: Edge TTS
        run: |
          python scripts/render_clip.py --text "$(cat script.txt)" --voice "$VOICE" --audio-out speech.mp3
          ffmpeg -y -i speech.mp3 -ar 16000 -ac 1 speech.wav

      - name: Cache Rhubarb
        uses: actions/cache@v4
        with:
          path: ${{ env.RHUBARB_DIR }}
          key: rhubarb-1-13-0-linux

      - name: Install Rhubarb
        run: bash scripts/ci_install_rhubarb.sh

      - name: Rhubarb lip cues
        continue-on-error: true
        run: ${{ env.RHUBARB_DIR }}/rhubarb -f json -o mouth.json --extendedShapes "" speech.wav

      - name: Render MEZI sprites
        run: bash scripts/ci_render.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mezi-tiktok
          path: |
            output.mp4
            script.txt
            script_job.json
            topic.json
            speech.mp3
            mouth.json
            bg.txt
            bg_path.txt
          if-no-files-found: error
          retention-days: 7
