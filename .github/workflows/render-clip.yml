name: qxil-job

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  RHUBARB_DIR: ${{ github.workspace }}/.rhubarb
  MODEL_DIR: ${{ github.workspace }}/models
  GEMMA_FILE: gemma-2-2b-it-Q4_K_M.gguf
  GEMMA_URL: https://huggingface.co/bartowski/gemma-2-2b-it-GGUF/resolve/main/gemma-2-2b-it-Q4_K_M.gguf
  TINY_FILE: TinyLlama-1.1B-Chat-v1.0.Q4_K_M.gguf
  TINY_URL: https://huggingface.co/TheBloke/TinyLlama-1.1B-Chat-v1.0-GGUF/resolve/main/tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf
  VOICE: en-US-GuyNeural
  ACTIONS: talk,walk,point,laugh
  OPENROUTER_MODEL: openrouter/free

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: deps-sys
        run: sudo apt-get update && sudo apt-get install -y ffmpeg unzip fonts-dejavu-core

      - name: deps-py
        run: |
          pip install --upgrade pip
          pip install edge-tts Pillow requests
          pip install llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu || pip install llama-cpp-python || true

      - name: host-layers
        run: python scripts/write_mezi_assets.py

      - name: topic
        run: python scripts/fetch_topics.py topic.json

      - name: cache-models
        uses: actions/cache@v4
        with:
          path: ${{ env.MODEL_DIR }}
          key: gemma2-2b-q4km-tiny-v1

      - name: download-models
        run: |
          mkdir -p "$MODEL_DIR"
          [ -f "$MODEL_DIR/$GEMMA_FILE" ] || curl -L --fail -o "$MODEL_DIR/$GEMMA_FILE" "$GEMMA_URL" || true
          [ -f "$MODEL_DIR/$TINY_FILE" ] || curl -L --fail -o "$MODEL_DIR/$TINY_FILE" "$TINY_URL" || true

      - name: script
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ env.OPENROUTER_MODEL }}
        run: |
          python scripts/generate_script.py --topic topic.json --model "$MODEL_DIR/$GEMMA_FILE" --model-fallback "$MODEL_DIR/$TINY_FILE" --try-llm --out script_job.json
          python -c "import json; d=json.load(open('script_job.json')); print(d.get('engine'), d.get('short_title'))"
          cat tiktok_caption.txt || true
          cat script.txt

      - name: tts
        run: |
          python scripts/render_clip.py --text "$(cat script.txt)" --voice "$VOICE" --audio-out speech.mp3
          ffmpeg -y -i speech.mp3 -ar 16000 -ac 1 speech.wav

      - name: cache-lips
        uses: actions/cache@v4
        with:
          path: ${{ env.RHUBARB_DIR }}
          key: rhubarb-1-13-0-linux

      - name: lips-bin
        run: bash scripts/ci_install_rhubarb.sh

      - name: lips
        continue-on-error: true
        run: ${{ env.RHUBARB_DIR }}/rhubarb -f json -o mouth.json --extendedShapes "" speech.wav

      - name: render-1080
        run: bash scripts/ci_render.sh

      - name: verify-video
        run: |
          ls -lh output.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height -of default output.mp4

      - name: buffer
        continue-on-error: true
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          BUFFER_ORG_ID: ${{ secrets.BUFFER_ORG_ID }}
          VIDEO_PUBLIC_URL: ${{ secrets.VIDEO_PUBLIC_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/upload_buffer.py

      - name: pack
        uses: actions/upload-artifact@v4
        with:
          name: mike-tiktok
          path: |
            output.mp4
            script.txt
            script_job.json
            topic.json
            tiktok_caption.txt
            tiktok_comment.txt
            FIRST_COMMENT.txt
            buffer_result.json
            title_short.txt
          if-no-files-found: error
          retention-days: 3
