name: qxil-job

on:
  workflow_dispatch:
  schedule:
    - cron: "15 10,18 * * *"
  push:
    paths:
      - "data/force_run.tick"

permissions:
  contents: write

env:
  RHUBARB_DIR: ${{ github.workspace }}/.rhubarb
  MODEL_DIR: ${{ github.workspace }}/models
  PHI_FILE: phi-2.Q4_K_M.gguf
  PHI_URL: https://huggingface.co/TheBloke/phi-2-GGUF/resolve/main/phi-2.Q4_K_M.gguf
  VOICE: en-US-ChristopherNeural
  RATE: "+12%"
  OPENROUTER_MODEL: openrouter/free

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: schedule-diag
        run: |
          echo "event=${{ github.event_name }}"
          date -u
          if [ -f data/youtube_only.tick ]; then echo "MODE=youtube_only"; fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: deps-sys
        run: sudo apt-get update && sudo apt-get install -y ffmpeg unzip fonts-dejavu-core

      - name: deps-py
        run: |
          pip install --upgrade pip
          pip install edge-tts Pillow requests pytrends
          pip install google-api-python-client google-auth google-auth-oauthlib
          pip install llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu || pip install llama-cpp-python || true

      - name: host-layers
        run: python scripts/write_mezi_assets.py

      - name: trends
        continue-on-error: true
        timeout-minutes: 3
        run: |
          python scripts/fetch_trends.py || true
          cat data/trending_topics.json || true

      - name: topic
        timeout-minutes: 6
        run: |
          # Patch fetch_topics at runtime: offline extract + fail-fast DDG/wiki
          python3 << 'PY'
          from pathlib import Path
          p = Path("scripts/fetch_topics.py")
          t = p.read_text(encoding="utf-8")
          offline = '''
def summary_offline(title: str) -> dict:
    """Local extract so pipeline never dies when wiki/ddg are down."""
    if is_hard_blocked(title):
        return {}
    core = re.sub(
        r"(?i)^(types of|how|importance of|applications of|properties of|common mistakes in|exam tips on|revision on|key points on|factors affecting|uses of|ss[123]|jss|difference between)\\s+",
        "",
        title or "",
    ).strip() or (title or "this topic")
    extract = (
        f"{title} is a core secondary-school topic for WAEC, NECO and JAMB. "
        f"Students should understand what {core} means, recognise simple everyday examples, "
        f"and avoid common exam mistakes. Focus on clear definition, one worked idea, and why it matters."
    )
    return {
        "title": title,
        "extract": extract[:650],
        "description": "offline bank",
        "url": "",
        "bg": "classroom",
        "trend": False,
        "extract_source": "offline",
    }

'''
          if "def summary_offline" not in t:
              t = t.replace("def pick_from_fallback", offline + "def pick_from_fallback", 1)
          # Prefer offline last in pick_from_fallback
          t = t.replace(
              "for getter in (summary_wikipedia, summary_duckduckgo):",
              "for getter in (summary_wikipedia, summary_duckduckgo, summary_offline):",
          )
          # Shorter wiki backoff when 429
          t = t.replace("wait = min(45.0, 5.0 * (2 ** attempt) + random.uniform(0, 2))",
                        "wait = min(8.0, 2.0 * (2 ** attempt)); _WIKI_RATE_LIMITED = True")
          # DDG timeout 6s
          t = t.replace("headers=UA, timeout=25)", "headers=UA, timeout=6)")
          # Fail-fast flags
          if "_DDG_DEAD" not in t:
              t = t.replace("_WIKI_RATE_LIMITED = False", "_WIKI_RATE_LIMITED = False\n_DDG_DEAD = False", 1)
          p.write_text(t, encoding="utf-8")
          print("patched fetch_topics offline+failfast")
          PY
          python scripts/fetch_topics.py topic.json
          echo "--- topic.json ---"
          cat topic.json
          python -c "import json; t=json.load(open('topic.json')); assert t.get('extract') and len(t['extract'])>40; assert 'petroleum' not in t.get('title','').lower() and 'refiner' not in t.get('title','').lower(), t"

      - name: commit-seen-topics
        continue-on-error: true
        run: |
          git config user.name "mike-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/seen_topics.json data/trending_topics.json data/seed_topic.json || true
          git diff --cached --quiet || git commit -m "chore: mark topic seen + trends + seed state"
          git push || true

      - name: cache-phi2
        uses: actions/cache@v4
        with:
          path: ${{ env.MODEL_DIR }}
          key: phi2-q4km-v1

      - name: download-phi2
        run: |
          mkdir -p "$MODEL_DIR"
          [ -f "$MODEL_DIR/$PHI_FILE" ] || curl -L --fail -o "$MODEL_DIR/$PHI_FILE" "$PHI_URL" || true
          ls -lh "$MODEL_DIR" || true

      - name: script
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ env.OPENROUTER_MODEL }}
        run: |
          python scripts/generate_script.py --topic topic.json --model "$MODEL_DIR/$PHI_FILE" --try-llm --out script_job.json
          python -c "import json; d=json.load(open('script_job.json')); e=d.get('engine',''); assert e and not e.startswith('template'), e; print(e, d.get('short_title'), len(d.get('script','').split()), 'words'); print(d.get('script','')[:240]); print('DYK', d.get('did_you_know')); print('DEF', d.get('definition'))"
          test -s script.txt || python -c "import json; Path=__import__('pathlib').Path; s=json.load(open('script_job.json')).get('script',''); Path('script.txt').write_text(s.strip()+chr(10)); assert s.strip(), 'empty script'"
          wc -w script.txt

      - name: topic-image
        continue-on-error: true
        run: |
          python scripts/fetch_topic_image.py || true
          ls -lh topic_image.jpg 2>/dev/null || echo "no topic image (will skip beat)"

      - name: tts
        run: |
          if [ ! -s script.txt ]; then
            python -c "import json; from pathlib import Path; s=json.load(open('script_job.json')).get('script',''); Path('script.txt').write_text(s.strip()+chr(10)); assert s.strip(), 'empty script'"
          fi
          python scripts/render_clip.py --text "$(cat script.txt)" --voice "$VOICE" --rate="$RATE" --audio-out speech.mp3
          ffmpeg -y -i speech.mp3 -ar 16000 -ac 1 speech.wav
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 speech.mp3

      - name: cache-lips
        uses: actions/cache@v4
        with:
          path: ${{ env.RHUBARB_DIR }}
          key: rhubarb-1-13-0-linux

      - name: lips-bin
        run: bash scripts/ci_install_rhubarb.sh

      - name: lips
        continue-on-error: true
        run: ${{ env.RHUBARB_DIR }}/rhubarb -f json -o mouth.json --extendedShapes "GHX" speech.wav

      - name: render-1080
        run: bash scripts/ci_render.sh

      - name: verify-video
        run: |
          ls -lh output.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height -of default output.mp4
          ls -lh captions.srt 2>/dev/null || echo "no captions.srt"

      - name: consume-seed-after-success
        continue-on-error: true
        run: |
          git config user.name "mike-bot"
          git config user.email "bot@users.noreply.github.com"
          mkdir -p data
          printf '%s\n' '{"disabled": true, "note": "consumed after successful run"}' > data/seed_topic.json
          git add data/seed_topic.json data/seen_topics.json || true
          git diff --cached --quiet || git commit -m "chore: consume seed after successful run"
          git push || true

      - name: buffer
        continue-on-error: true
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          BUFFER_ORG_ID: ${{ secrets.BUFFER_ORG_ID }}
          VIDEO_PUBLIC_URL: ${{ secrets.VIDEO_PUBLIC_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f data/youtube_only.tick ]; then
            echo "SKIP buffer (youtube_only.tick present)"
            exit 0
          fi
          python scripts/upload_buffer.py

      - name: youtube
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          YOUTUBE_PRIVACY: ${{ secrets.YOUTUBE_PRIVACY }}
        run: |
          python scripts/upload_youtube.py
          cat youtube_result.json || true

      - name: pack
        uses: actions/upload-artifact@v4
        with:
          name: mike-tiktok
          path: |
            output.mp4
            script.txt
            script_job.json
            moves.json
            topic.json
            topic_image.jpg
            topic_image.json
            data/trending_topics.json
            tiktok_caption.txt
            tiktok_comment.txt
            mouth.json
            buffer_result.json
            youtube_result.json
            captions.srt
            title_short.txt
            hook.txt
            thumb_style.txt
          if-no-files-found: error
          retention-days: 3
