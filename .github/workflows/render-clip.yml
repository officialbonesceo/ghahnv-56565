name: Render talking clip

on:
  workflow_dispatch:
    inputs:
      script_text:
        description: "What MEZI says"
        required: true
        default: "Hey! Why is the sky blue? Sunlight is made of many colors. Blue scatters in all directions — that is why we see a blue sky!"
      voice:
        description: "Edge TTS voice"
        required: true
        default: "en-US-GuyNeural"
        type: choice
        options:
          - en-US-GuyNeural
          - en-US-JennyNeural
          - en-NG-AbeoNeural
          - en-NG-EzinneNeural
          - en-GB-SoniaNeural
      room:
        description: "Background room"
        required: true
        default: "science"
        type: choice
        options: [studio, science, tech]
      actions:
        description: "Timeline: idle,walk,point,laugh"
        required: true
        default: "idle,point,walk,idle"
      use_rhubarb:
        description: "Lip sync with Rhubarb"
        required: true
        default: true
        type: boolean

env:
  RHUBARB_VERSION: "1.13.0"
  RHUBARB_DIR: ${{ github.workspace }}/.rhubarb

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y ffmpeg unzip
      - name: Python deps
        run: pip install -r requirements.txt
      - name: TTS
        env:
          SCRIPT_TEXT: ${{ inputs.script_text }}
          VOICE: ${{ inputs.voice }}
        run: |
          set -e
          printf '%s\n' "$SCRIPT_TEXT" > script.txt
          python scripts/render_clip.py --text "$SCRIPT_TEXT" --voice "$VOICE" --audio-out speech.mp3
          ffmpeg -y -i speech.mp3 -ar 16000 -ac 1 speech.wav
      - name: Cache Rhubarb
        if: ${{ inputs.use_rhubarb }}
        uses: actions/cache@v4
        with:
          path: ${{ env.RHUBARB_DIR }}
          key: rhubarb-${{ env.RHUBARB_VERSION }}-linux
      - name: Install Rhubarb
        if: ${{ inputs.use_rhubarb }}
        run: |
          set -e
          if [ ! -x "$RHUBARB_DIR/rhubarb" ]; then
            mkdir -p "$RHUBARB_DIR" /tmp/rhubarb
            URL="https://github.com/DanielSWolf/rhubarb-lip-sync/releases/download/v${RHUBARB_VERSION}/Rhubarb-Lip-Sync-${RHUBARB_VERSION}-Linux.zip"
            curl -L --fail -o /tmp/rhubarb.zip "$URL"
            unzip -o /tmp/rhubarb.zip -d /tmp/rhubarb
            BIN=$(find /tmp/rhubarb -type f -name rhubarb | head -1)
            cp "$BIN" "$RHUBARB_DIR/rhubarb"
            chmod +x "$RHUBARB_DIR/rhubarb"
            cp -a "$(dirname "$BIN")"/. "$RHUBARB_DIR"/ || true
          fi
      - name: Rhubarb
        if: ${{ inputs.use_rhubarb }}
        continue-on-error: true
        run: "$RHUBARB_DIR/rhubarb" -f json -o mouth.json --extendedShapes "" speech.wav
      - name: Render MEZI 2D
        env:
          ROOM: ${{ inputs.room }}
          ACTIONS: ${{ inputs.actions }}
        run: |
          set -e
          CUES=""
          if [ -f mouth.json ]; then CUES="--cues mouth.json"; fi
          PYTHONPATH=scripts python scripts/render_mezi.py \
            --audio speech.mp3 --out output_mezi.mp4 \
            --room "$ROOM" --actions "$ACTIONS" --fps 12 $CUES
          cp output_mezi.mp4 output.mp4
          ls -lh output.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: mezi-clip
          path: |
            output.mp4
            speech.mp3
            script.txt
            mouth.json
          if-no-files-found: error
          retention-days: 7
