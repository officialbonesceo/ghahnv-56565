name: Render talking clip

on:
  workflow_dispatch:
    inputs:
      voice:
        description: "Edge TTS voice"
        required: true
        default: "en-US-GuyNeural"
        type: choice
        options:
          - en-US-GuyNeural
          - en-US-JennyNeural
          - en-NG-AbeoNeural
          - en-NG-EzinneNeural
      actions:
        description: "Action timeline"
        required: true
        default: "talk,walk,point,laugh"
      use_llm:
        description: "Use Qwen2-0.5B for script (else template)"
        required: true
        default: true
        type: boolean

env:
  RHUBARB_VERSION: "1.13.0"
  RHUBARB_DIR: ${{ github.workspace }}/.rhubarb
  MODEL_DIR: ${{ github.workspace }}/models
  # Qwen2 0.5B Instruct Q4 — small, public
  MODEL_URL: https://huggingface.co/Qwen/Qwen2-0.5B-Instruct-GGUF/resolve/main/qwen2-0_5b-instruct-q4_k_m.gguf
  MODEL_FILE: qwen2-0_5b-instruct-q4_k_m.gguf

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip fonts-dejavu-core build-essential
          ffmpeg -version

      - name: Python deps
        run: |
          pip install --upgrade pip
          pip install edge-tts Pillow requests
          # llama-cpp may take a few minutes to build
          pip install llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu || \
            pip install llama-cpp-python

      - name: Fetch topic (Wikipedia, no seed)
        run: python scripts/fetch_topics.py topic.json

      - name: Cache Qwen GGUF
        if: ${{ inputs.use_llm }}
        uses: actions/cache@v4
        with:
          path: ${{ env.MODEL_DIR }}
          key: qwen2-0.5b-q4km-v1

      - name: Download Qwen2-0.5B GGUF
        if: ${{ inputs.use_llm }}
        run: |
          set -e
          mkdir -p "$MODEL_DIR"
          if [ ! -f "$MODEL_DIR/$MODEL_FILE" ]; then
            echo "Downloading model..."
            curl -L --fail -o "$MODEL_DIR/$MODEL_FILE" "$MODEL_URL" || \
              curl -L --fail -o "$MODEL_DIR/$MODEL_FILE" \
                "https://huggingface.co/Qwen/Qwen2-0.5B-Instruct-GGUF/resolve/main/qwen2-0_5b-instruct-q4_0.gguf"
          fi
          ls -lh "$MODEL_DIR" || true

      - name: Generate script (Qwen or template)
        env:
          USE_LLM: ${{ inputs.use_llm }}
        run: |
          set -e
          MODEL_PATH="$MODEL_DIR/$MODEL_FILE"
          if [ "$USE_LLM" != "true" ]; then
            MODEL_PATH="/nonexistent"
          fi
          python scripts/generate_script.py \
            --topic topic.json \
            --model "$MODEL_PATH" \
            --out script_job.json
          echo "--- script ---"
          cat script.txt
          echo "bg=$(cat bg.txt)"

      - name: Edge TTS
        env:
          VOICE: ${{ inputs.voice }}
        run: |
          set -e
          TEXT=$(cat script.txt)
          python scripts/render_clip.py --text "$TEXT" --voice "$VOICE" --audio-out speech.mp3
          ffmpeg -y -i speech.mp3 -ar 16000 -ac 1 speech.wav

      - name: Cache Rhubarb
        uses: actions/cache@v4
        with:
          path: ${{ env.RHUBARB_DIR }}
          key: rhubarb-${{ env.RHUBARB_VERSION }}-linux

      - name: Install Rhubarb
        run: |
          set -e
          if [ -x "$RHUBARB_DIR/rhubarb" ]; then exit 0; fi
          mkdir -p "$RHUBARB_DIR" /tmp/rhubarb
          URL="https://github.com/DanielSWolf/rhubarb-lip-sync/releases/download/v${RHUBARB_VERSION}/Rhubarb-Lip-Sync-${RHUBARB_VERSION}-Linux.zip"
          curl -L --fail -o /tmp/rhubarb.zip "$URL"
          unzip -o /tmp/rhubarb.zip -d /tmp/rhubarb
          BIN=$(find /tmp/rhubarb -type f -name rhubarb | head -1)
          cp "$BIN" "$RHUBARB_DIR/rhubarb"
          chmod +x "$RHUBARB_DIR/rhubarb"
          cp -a "$(dirname "$BIN")"/. "$RHUBARB_DIR"/ || true

      - name: Rhubarb
        continue-on-error: true
        run: "$RHUBARB_DIR/rhubarb" -f json -o mouth.json --extendedShapes "" speech.wav

      - name: Render MEZI TikTok
        env:
          ACTIONS: ${{ inputs.actions }}
        run: |
          set -e
          TEXT=$(cat script.txt)
          BG=$(cat bg.txt 2>/dev/null || echo studio)
          TITLE=$(python -c "import json;print(json.load(open('script_job.json')).get('title','Mezi'))")
          CUES=""
          if [ -f mouth.json ]; then CUES="--cues mouth.json"; fi
          python scripts/render_mezi.py \
            --audio speech.mp3 \
            --text "$TEXT" \
            --title "$TITLE" \
            --bg "$BG" \
            --out output.mp4 \
            --actions "$ACTIONS" \
            $CUES
          ls -lh output.mp4
          ffprobe -hide_banner output.mp4 2>&1 | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: mezi-tiktok
          path: |
            output.mp4
            script.txt
            script_job.json
            topic.json
            speech.mp3
            mouth.json
            bg.txt
          if-no-files-found: error
          retention-days: 7
