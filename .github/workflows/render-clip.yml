name: qxil-job

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  RHUBARB_VERSION: "1.13.0"
  RHUBARB_DIR: ${{ github.workspace }}/.rhubarb
  MODEL_DIR: ${{ github.workspace }}/models
  MODEL_FILE: TinyLlama-1.1B-Chat-v1.0.Q4_K_M.gguf
  MODEL_URL: https://huggingface.co/TheBloke/TinyLlama-1.1B-Chat-v1.0-GGUF/resolve/main/tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf
  VOICE: en-US-GuyNeural
  ACTIONS: talk,walk,point,laugh

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: deps-sys
        run: sudo apt-get update && sudo apt-get install -y ffmpeg unzip fonts-dejavu-core

      - name: deps-py
        run: |
          pip install --upgrade pip
          pip install edge-tts Pillow requests
          pip install llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu || pip install llama-cpp-python || true

      - name: host-layers
        run: python scripts/write_mezi_assets.py

      - name: topic
        run: python scripts/fetch_topics.py topic.json

      - name: cache-model
        uses: actions/cache@v4
        with:
          path: ${{ env.MODEL_DIR }}
          key: tinyllama-q4km-v1

      - name: model
        run: |
          mkdir -p "$MODEL_DIR"
          if [ ! -f "$MODEL_DIR/$MODEL_FILE" ]; then
            curl -L --fail -o "$MODEL_DIR/$MODEL_FILE" "$MODEL_URL" || true
          fi

      - name: script
        run: |
          python scripts/generate_script.py --topic topic.json --model "$MODEL_DIR/$MODEL_FILE" --try-llm --out script_job.json
          cat script.txt

      - name: tts
        run: |
          python scripts/render_clip.py --text "$(cat script.txt)" --voice "$VOICE" --audio-out speech.mp3
          ffmpeg -y -i speech.mp3 -ar 16000 -ac 1 speech.wav

      - name: cache-lips
        uses: actions/cache@v4
        with:
          path: ${{ env.RHUBARB_DIR }}
          key: rhubarb-1-13-0-linux

      - name: lips-bin
        run: bash scripts/ci_install_rhubarb.sh

      - name: lips
        continue-on-error: true
        run: ${{ env.RHUBARB_DIR }}/rhubarb -f json -o mouth.json --extendedShapes "" speech.wav

      - name: board-art
        run: python scripts/board_refs.py || true

      - name: render
        run: bash scripts/ci_render.sh

      - name: buffer
        continue-on-error: true
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          VIDEO_PUBLIC_URL: ${{ secrets.VIDEO_PUBLIC_URL }}
        run: python scripts/upload_buffer.py

      - name: pack
        uses: actions/upload-artifact@v4
        with:
          name: qxil-out
          path: |
            output.mp4
            script.txt
            script_job.json
            topic.json
            speech.mp3
            buffer_channels.json
            buffer_result.json
            title_short.txt
          if-no-files-found: error
          retention-days: 3
