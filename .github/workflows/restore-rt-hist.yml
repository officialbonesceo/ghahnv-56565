name: restore-rt-hist
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/restore-rt-hist.yml"]
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: restore from history
        run: |
          set -e
          git show 87b743e997b3b82fba1370b87bfacbd74b6c1b73:scripts/render_teaser.py > scripts/render_teaser.py
          wc -c scripts/render_teaser.py
          head -3 scripts/render_teaser.py
          # Quick harden: widen card so long choices fit better
          python3 -c "
          from pathlib import Path
          t = Path('scripts/render_teaser.py').read_text()
          t = t.replace('card_x0, card_x1 = 380, W - 48', 'card_x0, card_x1 = 300, W - 28')
          t = t.replace('cf = font(36)', 'cf = font(28)')
          Path('scripts/render_teaser.py').write_text(t)
          print('patched size', Path('scripts/render_teaser.py').stat().st_size)
          "
          git config user.name "devmeziem"
          git config user.email "devmeziem@gmail.com"
          git add scripts/render_teaser.py
          git commit -m "fix: restore render_teaser + wider card + smaller choice font"
          git push
